<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>时光星瓶</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#050818;
  min-height:100vh;
  overflow:hidden;
  font-family:system-ui, sans-serif;
}
.star{
  position:absolute;
  font-size:28px;
  color:#ffe87c;
  cursor:pointer;
  transition:opacity 0.6s ease;
  user-select:none;
  animation:float 8s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translate(0,0) rotate(0deg);}
  50%{transform:translate(25px,-35px) rotate(12deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
.star.hide{
  opacity:0;
  pointer-events:none;
}
.msg-box{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(20,25,45,0.94);
  color:#fff;
  padding:28px;
  border-radius:18px;
  max-width:88%;
  display:none;
  z-index:99;
  border:1px solid #846fd8;
}
.msg-content{
  line-height:1.8;
  font-size:17px;
  margin-bottom:16px;
}
.msg-time{
  font-size:13px;
  opacity:0.65;
  margin-bottom:20px;
}
.close-btn{
  width:100%;
  padding:9px;
  border:none;
  border-radius:10px;
  background:#826cd4;
  color:#fff;
  font-size:15px;
}
.input-area{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  z-index:10;
}
textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  border:1px solid #6c5eb8;
  color:#fff;
  font-size:16px;
  outline:none;
}
.submit{
  margin-top:10px;
  width:100%;
  padding:11px;
  border-radius:12px;
  border:none;
  background:#826cd4;
  color:#fff;
  font-size:16px;
}
.loading-txt{
  position:fixed;
  top:46%;
  left:50%;
  transform:translate(-50%,-50%);
  color:#ddd;
  font-size:26px;
}
</style>
</head>
<body>
<div class="loading-txt" id="loadingText">正在唤醒星星...</div>
<div class="msg-box" id="msgBox">
  <div class="msg-content" id="msgContent"></div>
  <div class="msg-time" id="msgTime"></div>
  <button class="close-btn" onclick="closeMsg()">收好星星 ✦</button>
</div>

<div class="input-area">
  <textarea id="inputBox" placeholder="写下一句话，化作一颗星星留在时光瓶..." rows="3" maxlength="120"></textarea>
  <button class="submit" onclick="sendMessage()">投放星星</button>
</div>

<script>
const loadingText = document.getElementById("loadingText");
const msgBox = document.getElementById("msgBox");
const msgContent = document.getElementById("msgContent");
const msgTime = document.getElementById("msgTime");
const inputBox = document.getElementById("inputBox");

function closeMsg(){
  msgBox.style.display = "none";
}

function createStar(item){
  const star = document.createElement("div");
  star.className = "star";
  star.innerText = "✦";
  star.style.left = Math.random()*86 + "%";
  star.style.top = Math.random()*72 + "%";
  star.style.animationDuration = (6 + Math.random()*7)+"s";
  star.onclick = ()=>{
    msgContent.innerText = item.content;
    msgTime.innerText = item.create_time;
    msgBox.style.display = "block";
  };
  document.body.appendChild(star);
}

// 带超时请求，3000ms失败直接提示
async function loadAllMessage(){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),3000);
  try{
    const res = await fetch("/api/get", {signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error("接口异常");
    const list = await res.json();
    loadingText.remove();
    list.forEach(item=>createStar(item));
  }catch(err){
    loadingText.innerText = "读取星星失败，请刷新页面";
    console.error("加载错误：",err);
  }
}

async function sendMessage(){
  const text = inputBox.value.trim();
  if(!text){
    alert("请输入内容");
    return;
  }
  const res = await fetch("/api/add",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:text})
  });
  const data = await res.json();
  if(data.success){
    alert("投放成功！刷新页面即可看见");
    inputBox.value = "";
  }else{
    alert("投放失败");
  }
}

loadAllMessage();
</script>
</body>
</html>
